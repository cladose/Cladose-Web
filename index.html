<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f1ea">

  <title>Cladose — Learning for curious people</title>
  <meta
    name="description"
    content="Cladose is a thoughtful learning product being built for curious people."
  >

  <meta property="og:title" content="Cladose">
  <meta
    property="og:description"
    content="A thoughtful learning product being built for curious people."
  >
  <meta property="og:type" content="website">

  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Cladose home">
        <img
          class="brand-wordmark"
          src="cladose-wordmark.png"
          alt="Cladose"
          width="543"
          height="181"
        >
      </a>
    </header>

    <main class="hero">
      <section class="hero-copy" aria-labelledby="hero-title">
        <p class="eyebrow">Learning, thoughtfully built.</p>

        <h1 id="hero-title">For curious people.</h1>

        <p class="intro">
          Cladose is a learning product being built for people who want to keep
          exploring, connecting ideas, and growing what they know.
        </p>

        <p class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Currently in development.
        </p>
      </section>

      <div class="hero-art" aria-hidden="true">
        <img
          src="cladose-hero.png"
          alt=""
          width="1672"
          height="941"
          fetchpriority="high"
        >
      </div>
    </main>

    <footer class="site-footer">
      <p>© 2026 Cladose</p>
    </footer>
  </div>
</body>
</html>
